general.import = [
    "~/.config/alacritty/catppuccin-frappe.toml"
]

[window]
padding = {x = 12, y = 12}
dynamic_padding = true
opacity = 0.95
blur = true

[font]
size = 14.0

[font.normal]
family = "JetBrainsMono Nerd Font"

[cursor]
style = { shape = "Block", blinking = "On" }

[env]
TERM = "xterm-256color"
